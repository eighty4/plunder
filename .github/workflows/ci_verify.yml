name: CI Verify
run-name: Verify ${{ github.ref }}
on:
  pull_request:
    branches: [main]
  push:
  workflow_call:

env:
  NODE_VERSION: 26

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@${{ env.NODE_VERSION }}
      - name: playwright install for e2e tests
        run: pnpm exec playwright install chromium --only-shell --with-deps
        working-directory: webapp
      - name: playwright install for plunder cli
        run: pnpm exec playwright install webkit --with-deps
        working-directory: core
      - run: pnpm -r build
      - run: ./webapp/create-test-reports.sh
      - run: pnpm -r test
      - run: pnpm exec prettier --check .
      - run: echo 'With galleons and guns'
